services:
  api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '3000'

  worker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - .env

  caddy:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/docker/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      - api
