services:
  api:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '3000'
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /marketplace/prod
        awslogs-create-group: "true"
        awslogs-stream-prefix: api

  worker:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /marketplace/prod
        awslogs-create-group: "true"
        awslogs-stream-prefix: worker

  caddy:
    platform: linux/arm64
    build:
      context: .
      dockerfile: infra/docker/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
    volumes:
      # Certificates and ACME account state live here — without a named
      # volume, every `docker compose up -d --build` (the deploy command)
      # replaces the container and Caddy re-requests a fresh cert, which
      # burns Let's Encrypt's per-domain rate limit on a rebuild-heavy
      # workflow like this one.
      - caddy_data:/data
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /marketplace/prod
        awslogs-create-group: "true"
        awslogs-stream-prefix: caddy

volumes:
  caddy_data:
