services:
  api:
    image: ghcr.io/nimrodev/marketplace-catalog-api:latest
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '3000'
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /marketplace/prod
        awslogs-create-group: "true"
        tag: api

  worker:
    image: ghcr.io/nimrodev/marketplace-catalog-worker:latest
    platform: linux/arm64
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /marketplace/prod
        awslogs-create-group: "true"
        tag: worker

  caddy:
    image: ghcr.io/nimrodev/marketplace-catalog-caddy:latest
    platform: linux/arm64
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - api
    volumes:
      # Certificates and ACME account state live here — without a named
      # volume, every deploy's fresh container replaces this and Caddy
      # re-requests a cert, which burns Let's Encrypt's per-domain rate
      # limit on a deploy-heavy workflow like this one.
      - caddy_data:/data
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-central-1
        awslogs-group: /marketplace/prod
        awslogs-create-group: "true"
        tag: caddy

volumes:
  caddy_data:
