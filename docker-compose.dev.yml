services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
      POSTGRES_DB: marketplace_dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U marketplace -d marketplace_dev']
      interval: 2s
      timeout: 3s
      retries: 15

  localstack:
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: eu-central-1
    ports:
      - '4566:4566'
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
      target: deps
    working_dir: /repo
    command: pnpm --filter @marketplace/api dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: '3000'
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace_dev
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_PRESCREEN_QUEUE_URL: http://localstack:4566/000000000000/marketplace-prescreen
      SQS_ENDPOINT: http://localstack:4566
      S3_PHOTOS_BUCKET: marketplace-catalog-photos
      S3_ENDPOINT: http://localstack:4566
      # api reaches localstack over the Docker network; a browser using a
      # presigned URL needs the host-mapped port instead.
      S3_PUBLIC_ENDPOINT: http://localhost:4566
    ports:
      - '3000:3000'
    volumes:
      - .:/repo
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - shared_node_modules:/repo/packages/shared/node_modules
      - root_node_modules:/repo/node_modules

  worker:
    build:
      context: .
      # Same shared deps stage as api/web — see the web service's comment.
      dockerfile: infra/docker/api.Dockerfile
      target: deps
    working_dir: /repo
    command: pnpm --filter @marketplace/worker dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://marketplace:marketplace@postgres:5432/marketplace_dev
      AWS_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_PRESCREEN_QUEUE_URL: http://localstack:4566/000000000000/marketplace-prescreen
      SQS_ENDPOINT: http://localstack:4566
      S3_PHOTOS_BUCKET: marketplace-catalog-photos
      S3_ENDPOINT: http://localstack:4566
      # Optional — unset means the worker persists deterministic-only risk,
      # same degrade-cleanly behavior as the API's AI features.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - .:/repo
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - worker_node_modules:/repo/apps/worker/node_modules
      - shared_node_modules:/repo/packages/shared/node_modules
      - root_node_modules:/repo/node_modules

  web:
    build:
      context: .
      # Not a copy-paste mistake: `deps` is the shared pnpm-workspace-install
      # stage (all packages, api included), not api-specific. Reused here so
      # dev only needs one `pnpm install` layer instead of a near-duplicate
      # Dockerfile.
      dockerfile: infra/docker/api.Dockerfile
      target: deps
    working_dir: /repo
    command: pnpm --filter @marketplace/web dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    volumes:
      - .:/repo
      - api_node_modules:/repo/apps/api/node_modules
      - web_node_modules:/repo/apps/web/node_modules
      - shared_node_modules:/repo/packages/shared/node_modules
      - root_node_modules:/repo/node_modules

volumes:
  postgres_data:
  api_node_modules:
  web_node_modules:
  worker_node_modules:
  shared_node_modules:
  root_node_modules:
