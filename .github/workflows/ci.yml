name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_ci
      AWS_REGION: eu-central-1
      # No LocalStack yet (added in MAR-23) — the readiness check correctly
      # reports SQS "down" against this placeholder, which is fine: the e2e
      # suite only asserts on response shape, not a specific status.
      SQS_PRESCREEN_QUEUE_URL: https://sqs.eu-central-1.amazonaws.com/000000000000/ci-placeholder
      S3_PHOTOS_BUCKET: ci-placeholder-bucket
      # Presigning is pure local SigV4 math — no network call to AWS — so
      # any syntactically valid key pair lets it succeed. Never used against
      # a real bucket; the CI runner has no other AWS credentials at all.
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7CIDUMMY
      AWS_SECRET_ACCESS_KEY: ci-dummy-secret-not-a-real-aws-key
      # CI-only value — signs test JWTs, never used against a real deploy.
      JWT_SECRET: ci-test-secret-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm migrate

      - run: pnpm test

      - run: pnpm test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Check deploy target is configured
        id: target
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Keeps the pipeline green and visible about why, instead of failing
      # on missing secrets, if EC2_HOST/EC2_SSH_KEY are ever unset again
      # (e.g. rotating to a new AWS account).
      - name: Skip deploy (no target configured)
        if: steps.target.outputs.ready != 'true'
        run: echo "::notice::EC2_HOST/EC2_SSH_KEY not configured — skipping deploy."

      - name: Checkout
        if: steps.target.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up SSH
        if: steps.target.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Sync app to the instance
        if: steps.target.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ secrets.EC2_HOST }}" 'mkdir -p ~/app'
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='infra/ec2' \
            -e 'ssh -o StrictHostKeyChecking=accept-new' \
            ./ "ubuntu@${{ secrets.EC2_HOST }}:~/app/"

      # Migrations run against the already-built image's compiled dist/,
      # not via `pnpm run` — the pruned prod image (api.Dockerfile) has no
      # src/ and an unresolved workspace:* reference, so `pnpm run
      # migration:run` fails its own dependency check before the script
      # body runs. This exact command is documented and was verified
      # against the built image in data-source.ts's own comment.
      - name: Deploy
        if: steps.target.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ secrets.EC2_HOST }}" '
            set -euo pipefail
            cd ~/app
            docker compose build
            docker compose run --rm api node_modules/.bin/typeorm-ts-node-commonjs migration:run -d dist/database/data-source.js
            docker compose up -d
          '

      - name: Smoke check
        if: steps.target.outputs.ready == 'true'
        run: |
          for _attempt in $(seq 1 10); do
            if curl -sf "http://${{ secrets.EC2_HOST }}/health" && curl -sf "http://${{ secrets.EC2_HOST }}/health/ready"; then
              echo "Deploy verified healthy."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Post-deploy smoke check failed — /health or /health/ready did not come back healthy."
          exit 1
