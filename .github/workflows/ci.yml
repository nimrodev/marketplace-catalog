name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

      localstack:
        image: localstack/localstack:3
        env:
          SERVICES: s3,sqs
          AWS_DEFAULT_REGION: eu-central-1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_ci
      AWS_REGION: eu-central-1
      SQS_PRESCREEN_QUEUE_URL: http://localhost:4566/000000000000/marketplace-prescreen
      SQS_ENDPOINT: http://localhost:4566
      S3_PHOTOS_BUCKET: marketplace-catalog-photos
      S3_ENDPOINT: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      # CI-only value — signs test JWTs, never used against a real deploy.
      JWT_SECRET: ci-test-secret-not-for-production-use

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Bootstrap LocalStack (S3 bucket + SQS queues)
        run: |
          aws --endpoint-url http://localhost:4566 s3 mb s3://marketplace-catalog-photos
          aws --endpoint-url http://localhost:4566 sqs create-queue --queue-name marketplace-prescreen-dlq
          DLQ_ARN=$(aws --endpoint-url http://localhost:4566 sqs get-queue-attributes \
            --queue-url http://localhost:4566/000000000000/marketplace-prescreen-dlq \
            --attribute-names QueueArn --query Attributes.QueueArn --output text)
          aws --endpoint-url http://localhost:4566 sqs create-queue --queue-name marketplace-prescreen \
            --attributes "{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"$DLQ_ARN\\\",\\\"maxReceiveCount\\\":\\\"5\\\"}\"}"

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # Schema setup, not a test — applies migrations to this job's ephemeral
      # Postgres so the e2e suite below has real tables to run against.
      - name: Apply migrations (CI database)
        run: pnpm migrate

      - run: pnpm test

      - run: pnpm test:e2e

  # Images are built here, on the Actions runner, and pushed to GHCR — not
  # built on the EC2 instance. The instance's own outbound path to
  # registry.npmjs.org was turning every deploy into a 10-40 minute
  # gamble (repeated connection resets, not registry rate-limiting).
  # Deploy now just pulls a finished image; nothing on the instance ever
  # talks to npm again.
  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            ghcr.io/${{ github.repository_owner }}/marketplace-catalog-api:latest
            ghcr.io/${{ github.repository_owner }}/marketplace-catalog-api:${{ github.sha }}

      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/worker.Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          tags: |
            ghcr.io/${{ github.repository_owner }}/marketplace-catalog-worker:latest
            ghcr.io/${{ github.repository_owner }}/marketplace-catalog-worker:${{ github.sha }}

      - name: Build and push caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/caddy.Dockerfile
          platforms: linux/arm64
          push: true
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
          tags: |
            ghcr.io/${{ github.repository_owner }}/marketplace-catalog-caddy:latest
            ghcr.io/${{ github.repository_owner }}/marketplace-catalog-caddy:${{ github.sha }}

  deploy:
    needs: [test, build-and-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Check deploy target is configured
        id: target
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Keeps the pipeline green and visible about why, instead of failing
      # on missing secrets, if EC2_HOST/EC2_SSH_KEY are ever unset again
      # (e.g. rotating to a new AWS account).
      - name: Skip deploy (no target configured)
        if: steps.target.outputs.ready != 'true'
        run: echo "::notice::EC2_HOST/EC2_SSH_KEY not configured — skipping deploy."

      - name: Checkout
        if: steps.target.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up SSH
        if: steps.target.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Sync app to the instance
        if: steps.target.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "ubuntu@${{ secrets.EC2_HOST }}" 'mkdir -p ~/app'
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='infra/ec2' \
            -e 'ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10' \
            ./ "ubuntu@${{ secrets.EC2_HOST }}:~/app/"

      # Migrations run against the already-built image's compiled dist/,
      # not via `pnpm run` — the pruned prod image (api.Dockerfile) has no
      # src/ and an unresolved workspace:* reference, so `pnpm run
      # migration:run` fails its own dependency check before the script
      # body runs. This exact command is documented and was verified
      # against the built image in data-source.ts's own comment.
      - name: Deploy
        if: steps.target.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "ubuntu@${{ secrets.EC2_HOST }}" '
            set -euo pipefail
            cd ~/app
            docker compose pull
            docker compose run --rm -e ALLOW_PROD_MIGRATION=true api node_modules/.bin/typeorm-ts-node-commonjs migration:run -d dist/database/data-source.js
            docker compose up -d
          '

      - name: Smoke check
        if: steps.target.outputs.ready == 'true'
        run: |
          # https, not http — Caddy auto-redirects :80 to :443, and curl
          # without -L treats a redirect as a "successful" response, so an
          # http check here would pass even if the app were actually down.
          # 20 attempts (up to 60s) gives a first-ever cert issuance via
          # ACME room to finish, not just an already-warm cache hit.
          url="https://${{ secrets.EC2_HOST }}.sslip.io"
          for _attempt in $(seq 1 20); do
            if curl -sf "$url/health" && curl -sf "$url/health/ready"; then
              echo "Deploy verified healthy."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Post-deploy smoke check failed — /health or /health/ready did not come back healthy."
          exit 1
