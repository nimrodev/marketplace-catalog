name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: marketplace
          POSTGRES_DB: marketplace_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketplace -d marketplace_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://marketplace:marketplace@localhost:5432/marketplace_ci
      AWS_REGION: eu-central-1
      # No LocalStack yet (added in MAR-23) — the readiness check correctly
      # reports SQS "down" against this placeholder, which is fine: the e2e
      # suite only asserts on response shape, not a specific status.
      SQS_PRESCREEN_QUEUE_URL: https://sqs.eu-central-1.amazonaws.com/000000000000/ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm build

      # No-op until MAR-5/MAR-8 add a real `migrate` script — same
      # --if-present convention as every other root script.
      - run: pnpm migrate

      - run: pnpm test

      - run: pnpm test:e2e

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Check deploy target is configured
        id: target
        run: |
          if [ -n "${{ secrets.EC2_HOST }}" ] && [ -n "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # MAR-43 (EC2 provisioning) hasn't landed yet, so there is nowhere to
      # deploy to. This step keeps the pipeline green and visible about why,
      # instead of failing on missing secrets every push until it does.
      - name: Skip deploy (no target yet)
        if: steps.target.outputs.ready != 'true'
        run: echo "::notice::EC2_HOST/EC2_SSH_KEY not configured yet (MAR-43 pending) — skipping deploy."

      - name: Checkout
        if: steps.target.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up SSH
        if: steps.target.outputs.ready == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Sync app to the instance
        if: steps.target.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ secrets.EC2_HOST }}" 'mkdir -p ~/app'
          rsync -az --delete \
            --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='infra/ec2' \
            -e 'ssh -o StrictHostKeyChecking=accept-new' \
            ./ "ubuntu@${{ secrets.EC2_HOST }}:~/app/"

      # MAR-5/MAR-8 haven't landed yet, so there's no migration mechanism
      # (and no pnpm/dev deps in the pruned prod image to run one with) —
      # the migration step lands here once that exists.
      - name: Deploy
        if: steps.target.outputs.ready == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new "ubuntu@${{ secrets.EC2_HOST }}" '
            set -euo pipefail
            cd ~/app
            docker compose up -d --build
          '

      - name: Smoke check
        if: steps.target.outputs.ready == 'true'
        run: |
          for _attempt in $(seq 1 10); do
            if curl -sf "http://${{ secrets.EC2_HOST }}/health" && curl -sf "http://${{ secrets.EC2_HOST }}/health/ready"; then
              echo "Deploy verified healthy."
              exit 0
            fi
            sleep 3
          done
          echo "::error::Post-deploy smoke check failed — /health or /health/ready did not come back healthy."
          exit 1
